name: ci

# Minutes count on a private repository: nothing runs for a change that cannot affect the result.
# The interface has a workflow of its own (web.yml).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "web/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "web/**", ".github/ISSUE_TEMPLATE/**", "LICENSE"]

# Nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request makes the run before it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # The suite takes about a minute; a hung test must not run for the default six hours.
    timeout-minutes: 15
    strategy:
      matrix:
        # Every supported Python on main, the oldest alone on a pull request.
        python: ${{ github.event_name == 'push' && fromJSON('["3.12", "3.13"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q
      - run: bash scripts/check-secrets.sh
